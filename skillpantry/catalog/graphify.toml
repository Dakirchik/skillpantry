id = "graphify"
number = 5
name = "graphify"
category = "code-understanding"
summary = "Кодовая база + доки + SQL + PDF → граф знаний, по которому агент ходит запросами"
description = """
Код разбирается локально через tree-sitter AST: детерминированно, без LLM, ничего не уходит с машины.
Документы, PDF и картинки обрабатываются моделью вашего ассистента. Связи помечены EXTRACTED или
INFERRED. Без эмбеддингов и векторной базы. Ставится как Python-CLI, который сам регистрирует
скилл `/graphify` в Claude Code, Codex, Cursor и Gemini CLI.
"""
status = "verified"
risk = "low"
work_safe = true
confirm = false
reviewed = "2026-11-02"
tags = ["codebase", "knowledge-graph", "onboarding"]
risk_notes = [
  "Graphify Cloud — платная облачная часть, для работы не нужна",
]
overlaps = ["understand-anything"]

summary_en = "Codebase + docs + SQL + PDF → a knowledge graph the agent queries"
description_en = """
Code is parsed locally with tree-sitter ASTs: deterministic, no LLM, nothing leaves the machine.
Documents, PDFs and images are processed by your assistant's model. Relations are marked
EXTRACTED or INFERRED. No embeddings or vector database. Installs as a Python CLI that registers
the `/graphify` skill in Claude Code, Codex, Cursor and Gemini CLI itself.
"""
risk_notes_en = [
  "Graphify Cloud is a paid cloud part, not needed to use it",
]

