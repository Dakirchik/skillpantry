description = """
Сервер-шлюз (Node.js): роутинг по провайдерам и моделям, кэш, сжатие контекста, ключи, вебхуки.
Подключается к Claude Code как HTTP MCP и/или через base URL. Ставится вручную.
"""
status = "verified"
