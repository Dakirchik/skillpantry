summary_en = "25 skills for the full development cycle: spec → plan → code → tests → review → release"
description_en = """
24 lifecycle skills plus the `using-agent-skills` meta-skill. Each one is a process with steps,
verification checkpoints and anti-rationalization tables (against “good enough”). Claude Code
also gets the /spec, /plan, /build, /test, /review, /ship and other slash commands. Skills can
be installed selectively: --skill spec-driven-development --skill code-review-and-quality.
"""
risk_notes_en = [
