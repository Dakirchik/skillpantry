description = """
24 «lifecycle»-скилла и мета-скилл `using-agent-skills`. Каждый — процесс с шагами, контрольными
точками проверки и таблицами anti-rationalization (против «и так сойдёт»). Для Claude Code
дополнительно ставятся slash-команды /spec, /plan, /build, /test, /review, /ship и др.
Скилл можно ставить выборочно: --skill spec-driven-development --skill code-review-and-quality.
"""
